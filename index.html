<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CobroYa - Modo Offline</title>
    <!-- Estilos de Stlite -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.31.1/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Caja fuerte para tu código Python -->
    <textarea id="codigo_python" style="display: none;">

import streamlit as st
import pandas as pd
import pytz

# PEGA AQUÍ TU CÓDIGO EXACTO


    </textarea>

    <!-- Cargamos el motor de Stlite -->
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.31.1/build/stlite.js"></script>
    
    <script>
      // Esperamos a que la ventana cargue por completo para evitar errores de referencia
      window.addEventListener("load", function() {
        const miCodigo = document.getElementById("codigo_python").value;

        stlite.mount(
          {
            requirements: [
              "streamlit", "pandas", "plotly", "st-supabase-connection",
              "supabase", "fpdf2", "requests", "Pillow", "groq", "qrcode",
              "streamlit-geolocation", "streamlit-js-eval", "folium",
              "streamlit-folium", "pytz"
            ],
            mainScriptData: miCodigo
          },
          document.getElementById("root")
        );
      });
    </script>
  </body>
</html>
